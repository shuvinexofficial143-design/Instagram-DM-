<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Auto Replys - Instagram DM Automation Platform</title>
    <meta name="description" content="Answer Instagram DMs, respond to comments and organize leads with Auto Replys. Set up your assistant, test replies and stay in control." />
    <meta property="og:title" content="Auto Replys - Instagram DM Automation Platform" />
    <meta property="og:description" content="Answer Instagram DMs, respond to comments and organize leads with Auto Replys. Set up your assistant, test replies and stay in control." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html,body{margin:0;background:#07040d;font-family:Inter,Arial,sans-serif}
      #boot-screen{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;min-height:100dvh;padding:24px;box-sizing:border-box;background:radial-gradient(ellipse at 50% 53%,#291341 0%,#0d0619 45%,#050309 80%);color:#f6edff;text-align:center;overflow:hidden}
      .boot-content{width:min(580px,100%);display:flex;flex-direction:column;align-items:center;animation:boot-arrive .7s ease both}
      .boot-art{width:min(500px,88vw);height:auto;max-height:45dvh;object-fit:contain;filter:drop-shadow(0 0 22px #9d67e766);animation:boot-float 4s ease-in-out infinite}
      #boot-screen strong{font-size:clamp(29px,6vw,43px);letter-spacing:.03em;font-weight:700;background:linear-gradient(110deg,#fff,#d5acff,#fff);color:transparent;background-clip:text;animation:boot-shimmer 3s ease-in-out infinite;background-size:200%}
      #boot-screen p{color:#c9b7dd;font-size:14px;line-height:1.5;margin:12px 0 0}
      .boot-track{width:min(230px,65vw);height:3px;background:#49335d;border-radius:12px;margin-top:29px;overflow:hidden}.boot-track span{display:block;width:38%;height:100%;background:linear-gradient(90deg,#9b5de5,#eacbff);border-radius:12px;animation:boot-progress 1.7s ease-in-out infinite}
      .boot-status{margin-top:14px;color:#ac95c5;font-size:12px;letter-spacing:.04em}
      @keyframes boot-arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes boot-float{50%{transform:translateY(-9px)}}@keyframes boot-shimmer{50%{background-position:100% 50%}}@keyframes boot-progress{from{transform:translateX(-110%)}to{transform:translateX(300%)}}
      @media(prefers-reduced-motion:reduce){.boot-content,.boot-art,#boot-screen strong,.boot-track span{animation:none}}
    </style>
      <link rel="icon" type="image/svg+xml" href="/auto-replys-brand.svg" />
  </head>
  <body>
    <div id="boot-screen" role="status" aria-label="Auto Replys is loading"><div class="boot-content"><img class="boot-art" src="/loading-butterflies.svg" alt="" aria-hidden="true"/><strong>Auto Replys</strong><p>Making conversations feel effortless</p><div class="boot-track" aria-hidden="true"><span></span></div><div class="boot-status">Preparing your workspace…</div></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

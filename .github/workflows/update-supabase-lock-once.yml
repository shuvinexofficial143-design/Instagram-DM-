name: Update Supabase lockfile once

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/update-supabase-lock-once.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Update lockfile
        run: bun install

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Commit lockfile and remove one-time workflow
        run: |
          rm -f .github/workflows/update-supabase-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock .github/workflows/update-supabase-lock-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update lockfile for Supabase migration"
          git push origin HEAD:main

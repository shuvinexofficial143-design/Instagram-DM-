name: Fix auth profile response UI once

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_auth_profile_response_ui.py
      - .github/workflows/fix-auth-profile-response-ui-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        run: python3 scripts/fix_auth_profile_response_ui.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Commit validated fixes
        run: |
          rm -f scripts/fix_auth_profile_response_ui.py
          rm -f .github/workflows/fix-auth-profile-response-ui-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix auth profile identity and response page styling"
          git pull --rebase origin main
          git push origin HEAD:main

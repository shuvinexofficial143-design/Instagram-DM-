name: Apply Supabase Instagram store once

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_instagram_token_store_to_supabase.py
      - .github/workflows/apply-supabase-instagram-store-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply server migration
        run: python3 scripts/migrate_instagram_token_store_to_supabase.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Commit migrated server and remove one-time files
        run: |
          rm -f scripts/migrate_instagram_token_store_to_supabase.py
          rm -f .github/workflows/apply-supabase-instagram-store-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Move Instagram OAuth token storage to Supabase"
          git push origin HEAD:main

name: Final credential cleanup

on:
  push:
    branches: [main]
    paths:
      - scripts/final_security_cleanup.py
      - .github/workflows/final-security-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 scripts/final_security_cleanup.py
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Commit clean production code
        run: |
          rm -f scripts/final_security_cleanup.py
          rm -f .github/workflows/final-security-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove hardcoded production credentials"
          git push origin HEAD:main

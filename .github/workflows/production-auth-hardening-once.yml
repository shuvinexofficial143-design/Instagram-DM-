name: One-time production auth hardening

on:
  push:
    branches: [main]
    paths:
      - scripts/production_auth_hardening.py
      - .github/workflows/production-auth-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply security patch
        run: python3 scripts/production_auth_hardening.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Commit hardened production code and remove one-time patch files
        run: |
          rm -f scripts/production_auth_hardening.py
          rm -f .github/workflows/production-auth-hardening-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Harden signup and Instagram OAuth for production"
          git push origin HEAD:main

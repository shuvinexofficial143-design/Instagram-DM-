name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: UI regressions
        run: bun run test:ui

      - name: Connection regressions
        run: bun run test:connections

      - name: Automation and customer Sheet regressions
        run: bun run test:automations

      - name: Customer Data capture, isolation contract and safe exports
        run: bun run test:customer-data

      - name: DM runtime regressions
        run: bun run test:dm

      - name: Durable webhook queue regressions
        run: bun run test:queue

      - name: Guest store authorization contract
        run: bun run test:security

      - name: Customer support security regressions
        run: bun run test:support

      - name: Billing and payment regressions
        run: bun run test:billing

      - name: Invoice PDF and typography regressions
        run: bun run test:invoices

      - name: Customer lifecycle emails and visual receipt regressions
        run: bun run test:lifecycle

      - name: Verified dashboard and workspace hydration regressions
        run: bun run test:dashboard

      - name: Page design regression safeguards (excluding Analytics & Billing)
        run: bun run test:visual

      - name: Administrator workspace, campaign and pause security
        run: bun run test:admin

      - name: Production build
        run: bun run build

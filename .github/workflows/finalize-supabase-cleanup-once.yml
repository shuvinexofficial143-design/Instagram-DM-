name: Deterministic Supabase finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-supabase-cleanup-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final migration cleanup
        run: python3 scripts/finalize_supabase_migration.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Refresh lockfile
        run: bun install
      - name: TypeScript check
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Commit final Supabase migration
        run: |
          rm -f scripts/finalize_supabase_migration.py
          rm -f .github/workflows/finalize-supabase-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Supabase auth and isolated user workspaces"
          git push origin HEAD:main

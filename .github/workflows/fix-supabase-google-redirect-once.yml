name: Fix Supabase Google redirect once

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_supabase_google_redirect.py
      - .github/workflows/fix-supabase-google-redirect-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply redirect fix
        run: python3 scripts/fix_supabase_google_redirect.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Commit redirect fix
        run: |
          rm -f scripts/fix_supabase_google_redirect.py
          rm -f .github/workflows/fix-supabase-google-redirect-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Supabase Google OAuth production redirect"
          git pull --rebase origin main
          git push origin HEAD:main

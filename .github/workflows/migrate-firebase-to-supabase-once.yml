name: Migrate Firebase to Supabase once

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_firebase_to_supabase.py
      - .github/workflows/migrate-firebase-to-supabase-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Supabase migration patch
        run: python3 scripts/migrate_firebase_to_supabase.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies and refresh lockfile
        run: bun install

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Commit migrated code and remove one-time files
        run: |
          rm -f scripts/migrate_firebase_to_supabase.py
          rm -f .github/workflows/migrate-firebase-to-supabase-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Migrate authentication and user data from Firebase to Supabase"
          git push origin HEAD:main

name: Finalize Supabase migration once

on:
  push:
    branches: [main]
    paths:
      - scripts/finalize_supabase_migration.py
      - .github/workflows/finalize-supabase-migration-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cleanup
        run: python3 scripts/finalize_supabase_migration.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Refresh dependency lockfile
        run: bun install

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Commit clean Supabase code
        run: |
          rm -f scripts/finalize_supabase_migration.py
          rm -f .github/workflows/finalize-supabase-migration-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finalize Supabase auth and per-user workspace migration"
          git push origin HEAD:main
